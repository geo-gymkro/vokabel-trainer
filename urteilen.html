<title>Geo-Urteilswerkstatt</title>

<style>
/* Layout: Arbeitsheft – Material links (breit), Schreibplan rechts; am Handy Material als Klappteil oben */
:root{
  --paper:#ECF1EE; --surface:#FFFFFF; --surface2:#F4F7F5; --ink:#13222A; --muted:#566A70; --line:#C9D4D0;
  --petrol:#0E676C; --on-petrol:#FFFFFF; --petrol-soft:#D4E8E5;
  --ochre:#B4621A; --ochre-soft:#F5E2CD;
  --ok:#22704A; --ok-soft:#D7EDDF; --bad:#AE3434; --bad-soft:#F5DADA;
  --d-u:#3D8A3F; --d-w:#2F74B5; --d-g:#C08A12; --d-p:#8A5B34;
  --f-d:"Avenir Next","Segoe UI Variable Display","Segoe UI",Roboto,ui-sans-serif,system-ui,sans-serif;
  --f-b:"Segoe UI",Roboto,"Helvetica Neue",ui-sans-serif,system-ui,sans-serif;
  --f-m:ui-monospace,"SF Mono",Consolas,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0E1619; --surface:#16232A; --surface2:#1B2B32; --ink:#E2EBE9; --muted:#93A8AC; --line:#2B3E45;
  --petrol:#55B5B2; --on-petrol:#06282A; --petrol-soft:#173A3C;
  --ochre:#E39A50; --ochre-soft:#3A2A19;
  --ok:#5EBB84; --ok-soft:#173826; --bad:#E57070; --bad-soft:#3E1D1F;
  --d-u:#72C075; --d-w:#6DA8E0; --d-g:#E2B444; --d-p:#C9966A;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#0E1619; --surface:#16232A; --surface2:#1B2B32; --ink:#E2EBE9; --muted:#93A8AC; --line:#2B3E45;
  --petrol:#55B5B2; --on-petrol:#06282A; --petrol-soft:#173A3C;
  --ochre:#E39A50; --ochre-soft:#3A2A19;
  --ok:#5EBB84; --ok-soft:#173826; --bad:#E57070; --bad-soft:#3E1D1F;
  --d-u:#72C075; --d-w:#6DA8E0; --d-g:#E2B444; --d-p:#C9966A;
  color-scheme:dark; }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:400 17px/1.5 var(--f-b);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--petrol)}
button,select,input,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-d);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
.mono{font-family:var(--f-m);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.muted{color:var(--muted)}
.note{font-size:14px;color:var(--muted)}
:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--petrol);color:var(--on-petrol)}
.top-in{max-width:1120px;margin:0 auto;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{font-family:var(--f-d);font-weight:800;font-size:20px;white-space:nowrap;color:inherit;text-decoration:none}
.top a.out{color:var(--on-petrol);font-size:14px;font-weight:600;white-space:nowrap}
.wrap{max-width:1120px;margin:0 auto;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.narrow{max-width:760px;width:100%;margin:0 auto;display:grid;gap:16px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--petrol);color:var(--on-petrol);min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.warn{background:var(--bad);color:var(--surface)}
.btn.small{padding:6px 12px;min-height:36px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--petrol);text-decoration:underline;cursor:pointer;font-size:15px;font-weight:600}
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-m);font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:6px;border:1.5px solid currentColor}
.badge.bewerten{color:var(--ochre)} .badge.beurteilen{color:var(--petrol)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:0 0 auto}

/* Start */
.hero h1{font-size:clamp(30px,6vw,44px);font-weight:800;letter-spacing:-.02em}
.hero p{margin-top:6px;color:var(--muted);max-width:62ch}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:2px;min-width:0}
.steps li::before{content:counter(s);font-family:var(--f-d);font-weight:800;font-size:24px;color:var(--petrol);line-height:1}
.steps b{font-size:15px}
.steps span{font-size:13.5px;color:var(--muted);line-height:1.35}
.cases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.case{display:grid;gap:8px;align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-decoration:none;color:inherit;min-width:0}
.case:hover{border-color:var(--petrol)}
.case h3{font-size:21px}
.case .q{font-size:15px;color:var(--muted);line-height:1.4}
.case .pl{font-family:var(--f-m);font-size:12px;color:var(--ochre);text-transform:uppercase;letter-spacing:.04em}
.meter{display:flex;gap:4px}
.meter i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.meter i.on{background:var(--petrol)}

/* Fall */
.fall-head{display:grid;gap:8px}
.fall-head h1{font-size:clamp(26px,5vw,36px);font-weight:800}
.frage{font-size:19px;font-weight:600;max-width:70ch}
.fall-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.mats{display:grid;gap:10px}
.mat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px}
.mat .mh{display:flex;gap:8px;align-items:baseline}
.mat .mh b{font-family:var(--f-m);font-size:13px;color:var(--on-petrol);background:var(--petrol);border-radius:5px;padding:1px 6px}
.mat .mh span{font-weight:700}
.mat p{font-size:15.5px;line-height:1.5}
.mat .src{font-size:12.5px;color:var(--muted);font-style:italic}
details.matbox{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
details.matbox summary{cursor:pointer;font-weight:700;list-style-position:inside}
details.matbox[open] summary{margin-bottom:10px}
.stepper{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.stepper button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;cursor:pointer;display:grid;justify-items:center;gap:0;min-width:0;font-size:13px;font-weight:600;color:var(--muted)}
.stepper button b{font-family:var(--f-d);font-size:18px;color:var(--ink)}
.stepper button[aria-current="step"]{border-color:var(--petrol);background:var(--petrol);color:var(--on-petrol)}
.stepper button[aria-current="step"] b{color:var(--on-petrol)}
.stepper button.done{border-color:var(--petrol)}
.work{display:grid;gap:14px;min-width:0}
.work h2{font-size:24px}
label.lab{font-weight:700;display:block;margin-bottom:6px}
textarea,input[type=text],select{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px;line-height:1.45}
textarea{resize:vertical;min-height:84px}
textarea.big{min-height:300px}
.chipset{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:15px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.ins{display:inline-block;border:1px dashed var(--petrol);background:var(--petrol-soft);color:var(--ink);border-radius:8px;padding:4px 9px;font-size:14px;cursor:pointer;text-align:left}
.ins:hover{border-style:solid}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:10px;padding:12px 14px;display:grid;gap:4px}
.fb.ok{background:var(--ok-soft);border:1.5px solid var(--ok)}
.fb.no{background:var(--bad-soft);border:1.5px solid var(--bad)}
.fb.info{background:var(--ochre-soft);border:1.5px solid var(--ochre)}
.dimcard{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;background:var(--surface)}
.dimcard h3{font-size:19px;display:flex;align-items:center;gap:8px}
.arg{display:grid;gap:8px;padding:10px;border-radius:10px;background:var(--surface2);border:1px solid var(--line)}
.arg .ctl{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px;align-items:center}
.arg .ctl .seg{justify-self:start}
.wrow{display:inline-flex;align-items:center;gap:6px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 10px;font-weight:600;cursor:pointer;font-size:14px;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg.pc button[data-v="pro"][aria-pressed="true"]{background:var(--ok);color:var(--surface)}
.seg.pc button[data-v="contra"][aria-pressed="true"]{background:var(--bad);color:var(--surface)}
select.m{width:auto;padding:6px 8px;font-size:14px}
.help{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hint{font-size:15px;background:var(--ochre-soft);border-radius:8px;padding:8px 10px;display:grid;gap:6px}
.raster{width:100%;border-collapse:collapse;font-size:15px}
.raster th,.raster td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.raster th{font-family:var(--f-m);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tw{overflow-x:auto}
.pc-pro{color:var(--ok);font-weight:700} .pc-contra{color:var(--bad);font-weight:700}
.wt{font-family:var(--f-m);letter-spacing:1px;color:var(--ochre)}
.posline{display:grid;gap:6px}
.posline input{width:100%;accent-color:var(--petrol)}
.posline .ends{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.posline .now{font-weight:700;text-align:center}
.checks{display:grid;gap:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:15.5px}
.checks input{width:20px;height:20px;margin-top:2px;accent-color:var(--petrol);flex:0 0 auto}
.checks small{display:block;color:var(--muted);font-size:13.5px}
.muster{border:2px solid var(--ok);border-radius:var(--r);padding:16px;display:grid;gap:10px;background:var(--surface)}
.muster ul{margin:0;padding-left:20px}
.navrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* Reparieren */
.weak{font-size:17px;line-height:1.6;background:var(--surface2);border-left:4px solid var(--bad);padding:12px 14px;border-radius:0 10px 10px 0}
.good{font-size:16px;line-height:1.6;background:var(--ok-soft);border-left:4px solid var(--ok);padding:12px 14px;border-radius:0 10px 10px 0}
.res-ok{color:var(--ok);font-weight:700} .res-no{color:var(--bad);font-weight:700}

/* Schema & Bausteine */
.optable{width:100%;border-collapse:collapse;font-size:15.5px}
.optable th,.optable td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.optable th{font-family:var(--f-m);font-size:12px;text-transform:uppercase;color:var(--muted)}
.dims{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dimbox{border:1.5px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:4px}
.dimbox b{display:flex;align-items:center;gap:8px;font-family:var(--f-d);font-size:18px}
.dimbox span{font-size:14.5px;color:var(--muted)}
.ladder{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14.5px}
.ladder span{border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--surface2)}
.bgroup{display:grid;gap:8px}
.bgroup h3{font-size:18px}
.copied{color:var(--ok);font-size:13px;font-weight:700}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tab{display:grid;justify-items:center;gap:2px;padding:8px 2px 10px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--petrol)}

@media (min-width:980px){
  .fall-grid{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
  .fall-grid .side{position:sticky;top:76px;max-height:calc(100vh - 170px);overflow:auto;padding-right:4px}
  details.matbox{display:none}
}
@media (max-width:979px){ .fall-grid .side{display:none} }
@media (max-width:860px){ .cases{grid-template-columns:repeat(2,minmax(0,1fr))} .steps{grid-template-columns:minmax(0,1fr)} .steps li{grid-template-columns:28px auto 1fr;align-items:baseline;gap:8px} }
@media (max-width:560px){
  .cases,.dims{grid-template-columns:minmax(0,1fr)}
  .arg .ctl{grid-template-columns:auto 1fr}
  .stepper button{font-size:11px}
  .top a.out{display:none}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

<script>

};

    ["M4","Netz und Strompreis","Der Strom wird an der Küste erzeugt, aber vor allem im Süden und Westen Deutschlands verbraucht. Dafür sind neue Leitungen nötig, deren Kosten über die Netzentgelte alle Stromkunden tragen. Windstrom hat keine Brennstoffkosten und senkt in windreichen Stunden die Börsenstrompreise.","eigene Zusammenstellung"]

  args:{
    u:[["pro","Windstrom verursacht im Betrieb keine CO₂-Emissionen und trägt zum Klimaschutz bei.","M1"],["contra","Der Baulärm gefährdet den vom Aussterben bedrohten Schweinswal der Ostsee.","M3"]],
    w:[["pro","Servicehäfen wie Mukran schaffen dauerhafte Arbeitsplätze in einer strukturschwachen Küstenregion.","M2"],["contra","Der nötige Netzausbau verursacht hohe Kosten, die alle Stromkunden tragen.","M4"]],
    g:[["contra","Fischer verlieren Fanggebiete, Tourismusbetriebe fürchten um das Landschaftsbild.","M2"],["pro","Windstrom ohne Brennstoffkosten kann Strompreise dämpfen und Haushalte entlasten.","M4"]],
    p:[["pro","Mehr eigene Stromerzeugung verringert die Abhängigkeit von Energieimporten.","M1"],["contra","Viele Nutzungsansprüche auf engem Meeresraum führen zu Raumnutzungskonflikten, die Planungen verzögern.","M2"]]

  konflikt:"Ein Zielkonflikt besteht innerhalb der ökologischen Dimension: Der Klimaschutz durch Windstrom (M1) steht gegen den Schutz der Meeresnatur (M3). Schwerer wiegt meines Erachtens der Klimaschutz, weil der Klimawandel langfristig auch die Ostsee selbst bedroht. Der Konflikt lässt sich durch Schallschutz und Bauzeitenregeln abmildern, aber nicht ganz auflösen.",
  muster:"Ich bewerte den Ausbau der Offshore-Windenergie in der Ostsee am Leitbild nachhaltiger Entwicklung. Besonders stark gewichte ich dabei den Klimaschutz, weil seine Folgen global und für künftige Generationen kaum umkehrbar sind. Aus ökologischer Sicht spricht für den Ausbau, dass Windstrom im Betrieb keine CO₂-Emissionen verursacht (M1). Dem steht entgegen, dass der Baulärm den vom Aussterben bedrohten Schweinswal gefährdet (M3). Ökonomisch schaffen Servicehäfen dauerhafte Arbeitsplätze an der Küste (M2), zugleich verursacht der Netzausbau Kosten für alle Stromkunden (M4). Sozial verlieren Fischerei und Teile des Tourismus Fanggebiete bzw. den freien Horizont (M2). Damit zeigt sich ein Zielkonflikt innerhalb der ökologischen Dimension: Klimaschutz gegen Artenschutz. Schwerer wiegt für mich der Klimaschutz, weil der Klimawandel langfristig auch die Ostsee selbst bedroht. Insgesamt ist der Ausbau daher überwiegend nachhaltig. Dieses Urteil gilt allerdings nur, sofern Schallschutz, Bauzeiten und Schutzgebiete konsequent beachtet und Fischerei und Tourismus an der Planung beteiligt werden.",
  erw:["Wertmaßstab offengelegt (z. B. Nachhaltigkeitsdimensionen, Generationengerechtigkeit) und begründet","Argumente aus mindestens drei Dimensionen mit Materialbezug (M1–M4)","Zielkonflikt Klimaschutz – Artenschutz bzw. Wirtschaft – Fischerei/Tourismus benannt und gewichtet","Eindeutiges Werturteil mit Bedingung oder Handlungsempfehlung"]
},
{ id:"kakao", place:"Côte d’Ivoire", title:"Kakao ohne Entwaldung?", op:"beurteilen",
  frage:"Beurteile, inwieweit die EU-Entwaldungsverordnung zu einer nachhaltigen Kakaoproduktion in Côte d’Ivoire beitragen kann.",
  subj:"die EU-Entwaldungsverordnung", adj:"wirksam", poles:["unwirksam","wirksam"],
  akteure:["Kleinbauernfamilien","Kooperativen","Händler und Schokoladenindustrie","Regierung von Côte d’Ivoire","EU","Verbraucher in Europa"],
  mats:[
    ["M1","Kakao und Wald","Côte d’Ivoire produziert rund 40 % des weltweiten Kakaos. Schätzungen zufolge hat das Land seit 1960 über 80 % seiner Wälder verloren, ein großer Teil davon durch die Ausweitung von Kakaopflanzungen, auch in Schutzgebieten.","nach FAO und Weltbank, gerundet"],
    ["M2","Die Verordnung","Die EU-Entwaldungsverordnung erlaubt den Verkauf von Kakao, Kaffee, Soja, Palmöl, Rindfleisch, Holz und Kautschuk in der EU nur, wenn die Rohstoffe nicht auf Flächen erzeugt wurden, die nach dem 31.12.2020 entwaldet wurden. Importeure müssen dafür die Geodaten jeder Anbaufläche nachweisen. Für Länder außerhalb der EU gilt die Regel nicht. Der Start wurde mehrfach verschoben.","nach Verordnung (EU) 2023/1115, vereinfacht"],
    ["M3","Kleinbauern","Der Kakao stammt überwiegend von Hunderttausenden Kleinbauernfamilien mit wenigen Hektar Land. Viele leben unter der Armutsgrenze; laut einer Studie arbeiten in Côte d’Ivoire und Ghana rund 1,5 Millionen Kinder im Kakaoanbau. Für die Kartierung ihrer Flächen fehlen oft Geld, Technik und Landtitel.","nach NORC-Studie 2020 und eigener Zusammenstellung"],
    ["M4","Stimmen","Händler: „Wir kaufen künftig nur noch bei Kooperativen, deren Flächen kartiert sind.“ – Kleinbauer: „Wenn mein Feld nicht registriert ist, verliere ich meinen Käufer.“ – Agroforst-Projekt: „Kakao unter Schattenbäumen bringt pro Baum weniger Ertrag, aber stabilere Böden und Zusatzeinnahmen aus Früchten und Holz.“","typische Positionen, vereinfacht"]
  ],
  args:{
    u:[["pro","Kakao von nach 2020 gerodeten Flächen findet keinen Absatz mehr in der EU; das senkt den Anreiz für neue Rodungen.","M2"],["contra","Kakao von Rodungsflächen kann in Länder ohne solche Regeln verkauft werden; die Entwaldung verlagert sich nur.","M2"]],
    w:[["pro","Kartierte Lieferketten machen den Handel transparenter und können Prämien für nachhaltigen Kakao ermöglichen.","M4"],["contra","Die Kosten für Kartierung und Nachweise treffen vor allem Kleinbauern ohne Kapital.","M3"]],
    g:[["contra","Kleinbauern ohne Landtitel drohen aus den Lieferketten zu fallen; ihre Armut kann sich verschärfen.","M3"],["pro","Transparente Lieferketten erleichtern auch Kontrollen gegen Kinderarbeit.","M3"]],
    p:[["pro","Die EU nutzt ihre Marktmacht, um globale Umweltziele durchzusetzen.","M2"],["contra","Die Regeln werden in Europa gesetzt, ohne dass die Erzeugerländer mitentscheiden; die Verschiebungen zeigen die schwierige Umsetzung.","M2"]]
  },
  konflikt:"Zwischen Waldschutz und Existenzsicherung der Kleinbauern besteht ein Zielkonflikt: Strenge Nachweispflichten schützen den Wald (M2), können aber gerade die ärmsten Erzeuger vom Markt ausschließen (M3, M4). Für die Wirksamkeit ist entscheidend, ob beide Ziele zusammen erreicht werden, denn verarmte Bauern roden eher weiter.",
  muster:"Ich beurteile die EU-Entwaldungsverordnung danach, ob sie wirksam zu einer ökologisch, ökonomisch und sozial nachhaltigen Kakaoproduktion in Côte d’Ivoire beiträgt. Für ihre Wirksamkeit spricht, dass Kakao von nach 2020 gerodeten Flächen nicht mehr in die EU verkauft werden darf (M2). Da das Land rund 40 % des Weltkakaos erzeugt und bereits über 80 % seiner Wälder verloren hat (M1), entsteht ein starker Anreiz, neue Rodungen zu vermeiden. Gegen ihre Wirksamkeit spricht, dass Kakao von Rodungsflächen in Länder ohne solche Regeln ausweichen kann (M2). Ökonomisch und sozial ist die Verordnung problematisch: Die Kosten für Kartierung und Nachweise treffen Kleinbauern ohne Landtitel und Kapital (M3), sodass sie ihre Käufer verlieren können (M4). Hier zeigt sich ein Zielkonflikt zwischen Waldschutz und Existenzsicherung. Insgesamt trägt die Verordnung nur teilweise zu einer nachhaltigen Kakaoproduktion bei: Sie kann Entwaldung bremsen, löst aber die Armut der Erzeuger nicht. Wirksam wird sie erst, wenn Kartierung gefördert, Landrechte geklärt und faire Preise gezahlt werden, etwa für Agroforst-Kakao (M4).",
  erw:["Beurteilungskriterium genannt (Wirksamkeit für alle Nachhaltigkeitsdimensionen)","Ökologische Wirkung und Grenzen (Verlagerung) mit Materialbezug","Folgen für Kleinbauern und Kinderarbeit berücksichtigt","Zielkonflikt Waldschutz – Existenzsicherung","Differenziertes Sachurteil mit Bedingungen"]
},
{ id:"barcelona", place:"Barcelona, Spanien", title:"Schluss mit Ferienwohnungen", op:"bewerten",
  frage:"Bewerte die Entscheidung Barcelonas, bis 2028 alle rund 10 000 Lizenzen für touristische Ferienwohnungen auslaufen zu lassen.",
  subj:"das Auslaufen der Ferienwohnungs-Lizenzen", adj:"angemessen", poles:["unangemessen","angemessen"],
  akteure:["Anwohnerinnen und Anwohner","private Vermieter","Hotels","Touristen","Stadtregierung","Gastronomie und Handel"],
  mats:[
    ["M1","Zahlen zur Stadt","Barcelona hat rund 1,7 Millionen Einwohner. Der Tourismus trägt etwa 14 % zur Wirtschaftsleistung der Stadt bei. Laut Stadtverwaltung stiegen die Mieten in den letzten zehn Jahren um rund 68 %; der Wohnungsmangel gilt als größtes soziales Problem der Stadt.","nach Ajuntament de Barcelona, gerundet"],
    ["M2","Der Beschluss","2024 kündigte die Stadtregierung an, die Lizenzen der rund 10 000 legalen Ferienwohnungen bis November 2028 nicht zu verlängern. Die Wohnungen sollen auf den regulären Mietmarkt zurückkehren. Gleichzeitig wurde die Touristenabgabe erhöht. Kreuzfahrt- und Tagesgäste sind von der Maßnahme nicht betroffen.","eigene Zusammenstellung"],
    ["M3","Stimmen","Anwohnerin in Barceloneta: „In unserem Haus sind nur noch zwei Wohnungen dauerhaft bewohnt.“ – Vermieterverband: „Viele Familien finanzieren mit einer Ferienwohnung ihre Rente. Das ist eine Enteignung.“ – Ökonom: „Ob die Wohnungen wirklich an Einheimische vermietet werden, ist offen. Manche werden vielleicht verkauft oder illegal weitervermietet.“","typische Positionen, vereinfacht"],
    ["M4","Protest","Im Sommer 2024 demonstrierten Tausende gegen den Massentourismus; einige bespritzten Touristen mit Wasserpistolen. Die Tourismusbranche warnt vor einem Imageschaden für die Stadt.","nach Presseberichten"]
  ],
  args:{
    g:[["pro","Bis zu 10 000 Wohnungen könnten auf den Mietmarkt zurückkehren und den Mietanstieg bremsen.","M1, M2"],["contra","Ob die Wohnungen tatsächlich bezahlbar an Einheimische gehen, ist unsicher.","M3"]],
    w:[["contra","Private Vermieter verlieren Einnahmen, die Tourismusbranche fürchtet einen Imageschaden.","M3, M4"],["pro","Gäste weichen stärker auf Hotels aus, die geregelt Abgaben zahlen; die höhere Touristenabgabe bringt der Stadt Einnahmen.","M2"]],
    u:[["pro","Weniger Übernachtungsgäste in Wohnvierteln können die Überlastung dort verringern.","M2, M4"],["contra","Kreuzfahrt- und Tagesgäste sind nicht betroffen, das Hauptproblem der Überfüllung bleibt.","M2"]],
    p:[["pro","Die Stadt reagiert auf breiten Protest und stärkt Wohnen als Daseinsgrundfunktion.","M4"],["contra","Der Eingriff ins Eigentum ist umstritten und kann vor Gericht angefochten werden.","M3"]]
  },
  konflikt:"Es besteht ein Zielkonflikt zwischen den Einnahmen aus dem Tourismus, der etwa 14 % der Wirtschaftsleistung trägt (M1), und dem Ziel bezahlbaren Wohnens. Schwerer wiegt für mich das Wohnen, weil es alle Einwohner betrifft und Verdrängung kaum rückgängig zu machen ist.",
  muster:"Ich bewerte den Beschluss vor allem am Maßstab sozialer Gerechtigkeit, da Wohnen eine Daseinsgrundfunktion ist; ergänzend berücksichtige ich die wirtschaftlichen Folgen. Für die Entscheidung spricht, dass bis zu 10 000 Wohnungen auf den regulären Mietmarkt zurückkehren könnten (M2), während die Mieten in zehn Jahren um rund 68 % gestiegen sind (M1). Zudem reagiert die Stadt auf breiten Protest der Bevölkerung (M4). Dagegen spricht, dass private Vermieter Einnahmen verlieren und den Eingriff als Enteignung sehen (M3). Außerdem ist offen, ob die Wohnungen tatsächlich bezahlbar an Einheimische vermietet werden (M3), und Kreuzfahrt- sowie Tagesgäste bleiben unberührt (M2). Es besteht also ein Zielkonflikt zwischen den Einnahmen aus dem Tourismus, der etwa 14 % der Wirtschaftsleistung trägt (M1), und dem Ziel bezahlbaren Wohnens. Schwerer wiegt für mich das Wohnen, weil es alle Einwohner betrifft und Verdrängung kaum rückgängig zu machen ist. Insgesamt halte ich die Entscheidung für überwiegend angemessen, sofern die Stadt die frei werdenden Wohnungen mit Mietbindungen versieht und auch den Tagestourismus steuert.",
  erw:["Wertmaßstab offengelegt (z. B. soziale Gerechtigkeit, Recht auf Wohnen)","Positionen von Anwohnern, Vermietern und Tourismusbranche berücksichtigt","Grenzen der Maßnahme erkannt (Tagesgäste, unsichere Wirkung)","Zielkonflikt Tourismuseinnahmen – Wohnraum gewichtet","Werturteil mit Bedingung"]
},
{ id:"gruenheide", place:"Grünheide, Brandenburg", title:"Autowerk im Kiefernwald", op:"beurteilen",
  frage:"Beurteile die Ansiedlung des Tesla-Werks in Grünheide unter dem Gesichtspunkt einer nachhaltigen Regionalentwicklung.",
  subj:"die Ansiedlung des Werks", adj:"für die Region nachhaltig", poles:["nicht nachhaltig","nachhaltig"],
  akteure:["Unternehmen","Beschäftigte und Pendler","Gemeinde Grünheide","Wasserverband","Umweltverbände","Landesregierung"],
  mats:[
    ["M1","Das Werk","Seit 2022 baut Tesla in Grünheide südöstlich von Berlin Elektroautos, die als Baustein der Verkehrswende gelten. Rund 11 000 Menschen arbeiten dort (2024). Das Werksgelände umfasst rund 300 Hektar ehemaligen Kiefernforst.","nach Unternehmensangaben und Presseberichten, gerundet"],
    ["M2","Wasser","Teile des Geländes liegen in einem Wasserschutzgebiet. Brandenburg zählt zu den niederschlagsärmsten Bundesländern. Der Wasserverband hat dem Werk eine begrenzte Wassermenge zugesagt und warnt, dass für neue Wohngebiete und Betriebe in der Region kaum noch Wasser zur Verfügung steht.","nach Wasserverband Strausberg-Erkner, vereinfacht"],
    ["M3","Bürgerbefragung","Im Februar 2024 stimmten in einer nicht bindenden Befragung rund 62 % der teilnehmenden Grünheider gegen eine Erweiterung des Geländes, für die weiterer Wald gerodet werden sollte. Im Mai 2024 beschloss die Gemeindevertretung einen verkleinerten Bebauungsplan.","nach Gemeinde Grünheide und Presseberichten"],
    ["M4","Die Region","Zulieferer und Logistikfirmen siedeln sich an, Wohnraum im Umland wird knapper und teurer. Viele Beschäftigte pendeln aus Berlin und Polen ein; der Ausbau von Bahn und Straßen hinkt hinterher.","eigene Zusammenstellung"]
  ],
  args:{
    w:[["pro","Rund 11 000 Arbeitsplätze und neue Zulieferer lösen einen Multiplikatoreffekt in der Region aus.","M1, M4"],["contra","Die Region wird stark von einem einzigen Großunternehmen abhängig.","M1"]],
    u:[["contra","Hoher Wasserbedarf in einem trockenen Raum und teils im Wasserschutzgebiet gefährdet das Grundwasser.","M2"],["pro","Elektroautos können als Baustein der Verkehrswende Emissionen im Verkehr senken.","M1"]],
    g:[["contra","Steigende Wohnkosten und mehr Pendelverkehr belasten die Bevölkerung.","M4"],["pro","Industriearbeitsplätze bieten Beschäftigung für Menschen aus der ganzen Region.","M4"]],
    p:[["pro","Die Gemeinde begrenzt die Erweiterung über die Bauleitplanung.","M3"],["contra","Die Mehrheit in der Befragung lehnte eine Erweiterung ab; die Akzeptanz ist begrenzt.","M3"]]
  },
  konflikt:"Es besteht ein Zielkonflikt zwischen wirtschaftlicher Entwicklung (Arbeitsplätze, M1) und Ressourcenschonung (Wasser, Wald, M2). Da Wasser in der Region knapp und nicht ersetzbar ist und es weitere Entwicklung begrenzt, wiegt dieser Konflikt schwer.",
  muster:"Ich beurteile die Ansiedlung danach, ob sie die Region wirtschaftlich stärkt, ohne ihre natürlichen Grundlagen und die Lebensqualität dauerhaft zu belasten. Wirtschaftlich ist die Ansiedlung ein Erfolg: Rund 11 000 Arbeitsplätze (M1) und neue Zulieferer (M4) lösen einen Multiplikatoreffekt aus. Ökologisch ist sie dagegen kritisch zu sehen, denn das Werk liegt teilweise in einem Wasserschutzgebiet in einem der niederschlagsärmsten Bundesländer, und der Wasserverband sieht kaum Reserven für weitere Entwicklung (M2). Zudem wurde Kiefernforst gerodet (M1). Sozial stehen neue Industriearbeitsplätze steigenden Wohnkosten und mehr Pendelverkehr gegenüber (M4). Politisch zeigt die Bürgerbefragung von 2024, dass die Akzeptanz begrenzt ist (M3). Es besteht ein Zielkonflikt zwischen Wirtschaftswachstum und Ressourcenschonung; da Wasser in der Region knapp und nicht ersetzbar ist, wiegt er schwer. Insgesamt trägt die Ansiedlung nur teilweise zu einer nachhaltigen Regionalentwicklung bei. Positiver fiele das Urteil aus, wenn der Wasserverbrauch weiter sinkt, die Erweiterung begrenzt bleibt und Bahn- und Wohnungsbau Schritt halten.",
  erw:["Kriterium nachhaltige Regionalentwicklung erläutert","Arbeitsplätze und Multiplikatoreffekt mit Materialbezug","Wasser und Wald als begrenzende Ressourcen","Akzeptanz und Bauleitplanung (M3) einbezogen","Differenziertes Sachurteil mit Bedingungen"]
},
{ id:"atacama", place:"Salar de Atacama, Chile", title:"Lithium aus der Wüste", op:"bewerten",
  frage:"Bewerte, ob der Ausbau des Lithiumabbaus im Salar de Atacama mit einer nachhaltigen Entwicklung vereinbar ist.",
  subj:"der Ausbau des Lithiumabbaus", adj:"nachhaltig", poles:["nicht nachhaltig","nachhaltig"],
  akteure:["Bergbauunternehmen","Staat Chile","indigene Gemeinden","Autoindustrie in Europa und China","Umweltverbände","Käufer von E-Autos"],
  mats:[
    ["M1","Rohstoff der Energiewende","Lithium wird vor allem für Batterien von Elektroautos und Stromspeichern gebraucht; die weltweite Nachfrage soll sich bis 2030 vervielfachen. Chile ist nach Australien der zweitgrößte Produzent, ein großer Teil stammt aus dem Salar de Atacama.","nach IEA und USGS, vereinfacht"],
    ["M2","Gewinnung","Salzhaltiges Grundwasser (Sole) wird aus dem Untergrund gepumpt und in großen Becken verdunstet. Die Atacama gehört zu den trockensten Wüsten der Erde. Studien zeigen sinkende Grundwasserstände; Lagunen und Flamingo-Bestände werden beobachtet, die Ursachen sind teils umstritten.","eigene Zusammenstellung"],
    ["M3","Die Menschen","In den Oasen am Salzsee leben indigene Gemeinschaften der Lickanantay (Atacameños). Sie leben von Landwirtschaft und Tourismus und fordern Mitsprache beim Abbau. Ein Teil der Bergbaueinnahmen fließt als Abgaben an die Gemeinden.","eigene Zusammenstellung"],
    ["M4","Staatliche Strategie","2023 legte Chiles Regierung eine nationale Lithiumstrategie vor: Der Staat soll über das Staatsunternehmen Codelco die Mehrheit an wichtigen Abbauprojekten halten, und mehr Wertschöpfung soll im Land bleiben, z. B. durch Batteriefertigung. Neue Verfahren (direkte Lithiumextraktion) sollen weniger Wasser verdunsten lassen.","nach Regierung Chiles, vereinfacht"]
  ],
  args:{
    u:[["pro","Lithium ermöglicht Elektromobilität und Stromspeicher und damit globalen Klimaschutz.","M1"],["contra","Die Wasserentnahme in einer extremen Trockenregion gefährdet Grundwasser, Lagunen und Tierwelt.","M2"]],
    w:[["pro","Hohe Exporterlöse und die staatliche Mehrheit sichern Chile Einnahmen.","M1, M4"],["contra","Solange die Weiterverarbeitung im Ausland stattfindet, bleibt Chile vom Rohstoffexport abhängig.","M4"]],
    g:[["contra","Indigene Gemeinden tragen die Folgen der Wasserknappheit und fordern Mitsprache.","M3"],["pro","Abgaben an die Gemeinden finanzieren lokale Infrastruktur.","M3"]],
    p:[["pro","Die Lithiumstrategie will Kontrolle und Wertschöpfung im Land halten.","M4"],["contra","Die Mitsprache der indigenen Bevölkerung ist nicht gesichert.","M3"]]
  },
  konflikt:"Hier zeigt sich ein Zielkonflikt zwischen den Handlungsebenen: Der Nutzen für den Klimaschutz entsteht global (M1), die Kosten für Wasser und Lebensgrundlagen trägt die lokale Bevölkerung (M2, M3). Weil Wasser in der Atacama nicht ersetzbar ist und die Betroffenen wenig Einfluss haben, wiegt der lokale Schaden schwer.",
  muster:"Ich bewerte den Lithiumabbau nach den Dimensionen der Nachhaltigkeit und beziehe dabei bewusst zwei Handlungsebenen ein: den globalen Klimaschutz und die lokalen Lebensgrundlagen am Salzsee. Global spricht für den Ausbau, dass Lithium für Batterien und damit für Elektromobilität und Stromspeicher gebraucht wird (M1). Wirtschaftlich sichert der Abbau Chile hohe Einnahmen, und die staatliche Strategie will mehr Wertschöpfung im Land halten (M4). Lokal dagegen wird in einer der trockensten Wüsten der Erde Sole verdunstet; sinkende Grundwasserstände gefährden Lagunen und Landwirtschaft (M2). Die indigenen Lickanantay tragen diese Lasten und fordern Mitsprache (M3). Hier zeigt sich ein Zielkonflikt zwischen globalem Klimaschutz und lokalem Ressourcenschutz: Der Nutzen entsteht weltweit, die Kosten vor Ort. Weil Wasser in der Atacama nicht ersetzbar ist und die Betroffenen kaum Einfluss haben, wiegt der lokale Schaden für mich schwer. Insgesamt ist der Ausbau nur teilweise nachhaltig. Vertretbar wäre er, wenn wassersparende Verfahren verbindlich werden (M4), die Gemeinden mitentscheiden und die Abnehmerländer faire Standards mittragen.",
  erw:["Wertmaßstab offengelegt, Maßstabsebenen global – lokal unterschieden","Ökologische Folgen vor Ort und Nutzen für Klimaschutz mit Materialbezug","Perspektive der indigenen Gemeinden und Dependenz-Aspekt","Zielkonflikt zwischen Handlungsebenen gewichtet","Werturteil mit Bedingungen"]
},
{ id:"paris", place:"Paris, Frankreich", title:"Dreifache Parkgebühr für SUV", op:"bewerten",
  frage:"Bewerte die Entscheidung der Stadt Paris, die Parkgebühren für schwere Autos von Auswärtigen zu verdreifachen.",
  subj:"die höhere Parkgebühr für schwere Autos", adj:"sinnvoll", poles:["nicht sinnvoll","sinnvoll"],
  akteure:["Pariser Einwohner","Pendler aus dem Umland","Familien","Einzelhandel","Stadtregierung","Fuß- und Radverkehr"],
  mats:[
    ["M1","Der Beschluss","In einer Bürgerbefragung im Februar 2024 stimmten rund 55 % der Teilnehmenden für höhere Parkgebühren für schwere Autos; die Beteiligung lag bei etwa 6 %. Seit Oktober 2024 zahlen Auswärtige für Verbrenner und Hybride über 1,6 t sowie Elektroautos über 2 t im Zentrum 18 € statt 6 € pro Stunde. Anwohner sind ausgenommen.","nach Stadt Paris und Presseberichten, gerundet"],
    ["M2","Platz und Sicherheit","SUV sind größer und schwerer als Kleinwagen. Sie beanspruchen mehr Parkraum, verbrauchen mehr Energie und gefährden Fußgänger bei Unfällen stärker. Ihr Anteil an den Neuwagen in Frankreich ist stark gestiegen.","eigene Zusammenstellung"],
    ["M3","Verkehr in Paris","Seit Jahren baut Paris Radwege aus, sperrt Straßen für Autos und reduziert Parkplätze. Innerhalb von Paris wird nur ein kleiner Teil der Wege mit dem Auto zurückgelegt; viele Autofahrer kommen aus dem Umland, wo Bus und Bahn schlechter ausgebaut sind.","eigene Zusammenstellung"],
    ["M4","Stimmen","Autofahrerverband: „Das trifft Familien aus den Vororten, die auf ein großes Auto angewiesen sind.“ – Radfahrerverband: „Endlich zahlen die, die am meisten Platz verbrauchen.“ – Einzelhändler: „Kunden aus dem Umland bleiben weg.“","typische Positionen, vereinfacht"]
  ],
  args:{
    u:[["pro","Weniger schwere Autos senken Energieverbrauch, Emissionen und Flächenverbrauch.","M2"],["contra","Leichtere Autos und Anwohner sind ausgenommen; die Wirkung auf den Gesamtverkehr bleibt begrenzt.","M1"]],

function route(){
  const h = location.hash.slice(1);

  document.querySelectorAll(".tab").forEach(a => a.setAttribute("aria-current", (a.dataset.r === cur || (cur.startsWith("fall-") && a.dataset.r === "faelle")) ? "page" : "false"));

function insertAt(ta, str){
  const s = ta.selectionStart ?? ta.value.length, e = ta.selectionEnd ?? s;
  const before = ta.value.slice(0, s), sp = before && !/\s$/.test(before) ? " " : "";
  ta.value = before + sp + str + ta.value.slice(e);
  const p = s + sp.length + str.length; ta.focus(); ta.setSelectionRange(p, p);
  ta.dispatchEvent(new Event("input", { bubbles:true }));
}
async function copyText(txt, btn){
  let ok = false;
  try { await navigator.clipboard.writeText(txt); ok = true; } catch(e) {}
  if (!ok) { const t = document.createElement("textarea"); t.value = txt; document.body.appendChild(t); t.select(); try { ok = document.execCommand("copy"); } catch(e) {} t.remove(); }
  if (btn) { const o = btn.textContent; btn.textContent = ok ? "Kopiert" : "Bitte markieren und kopieren"; setTimeout(() => btn.textContent = o, 1600); }
}

  </tbody></table></div>` : `<p class="fb info">Noch keine Argumente formuliert. Geh zurück zu Schritt 3.</p>`}
  <div><p class="lab" style="font-weight:700;margin-bottom:6px">Zwischen welchen Dimensionen besteht ein Zielkonflikt?</p>
    <div class="row" style="flex-wrap:nowrap">${dimSel("ka", d.ka)}<span>↔</span>${dimSel("kb", d.kb)}</div>
    <p class="note" style="margin-top:6px">Ein Konflikt kann auch innerhalb einer Dimension liegen (z. B. Klimaschutz ↔ Artenschutz) oder zwischen Handlungsebenen (lokal ↔ global).</p></div>
  <div><label class="lab" for="kt">Zielkonflikt beschreiben und gewichten</label>
    ${insChips(["Zwischen … und … besteht ein Zielkonflikt: …","Schwerer wiegt meines Erachtens …, weil …","Zwar …, aber …","Der Konflikt lässt sich abmildern, indem …"], "kt")}
    <textarea id="kt" style="margin-top:8px;min-height:120px">${esc(d.kt)}</textarea></div>
  <div class="help"><button class="btn ghost small" id="khelp">${h ? "Beispiel ausblenden" : "Hilfe: Beispiel ansehen"}</button></div>
  ${h ? `<div class="hint">${esc(c.konflikt)}</div>` : ""}
  ${nav(c, d)}`;
  $("ka").onchange = e => { d.ka = e.target.value; save(); };
  $("kb").onchange = e => { d.kb = e.target.value; save(); };
  $("khelp").onclick = () => { hlp[c.id + "k"] = h ? 0 : 1; s4(c, d); };
  bindField("kt", d, "kt"); bindIns(); bindNav(c, d);
}

/* Schritt 5 */
function sentence(t){ t = t.trim(); if (!t) return ""; t = t[0].toUpperCase() + t.slice(1); return /[.!?]$/.test(t) ? t : t + "."; }
function skeleton(c, d){
  const verb = c.op === "bewerten" ? "bewerte" : "beurteile";
  const out = [`Im Folgenden ${verb} ich, ob ${c.subj} ${c.adj} ist.`];
  const dl = d.dims.map(k => DIMS[k].name).join(", ").replace(/, ([^,]*)$/, " und $1");
  let m = d.dims.length ? `Als Maßstab lege ich ${d.dims.length > 1 ? "die Dimensionen" : "die Dimension"} ${dl} nachhaltiger Entwicklung zugrunde` : "Als Maßstab lege ich … zugrunde";
  if (d.ebenen.length) m += ` und betrachte dabei die ${d.ebenen.map(e => e + "e").join(" und die ")} Ebene`;
  if (d.zeit.some(z => z.startsWith("langfristig"))) m += ", auch mit Blick auf künftige Generationen";
  out.push(m + ".");
  if (d.mass.trim()) out.push(sentence(d.mass));
  d.dims.forEach(k => (d.args[k] || []).filter(a => a.t.trim()).sort((a, b) => b.w - a.w).forEach((a, i) => {
    const t = a.t.trim().replace(/[.]$/, "");
    const lead = i === 0 ? `Aus ${DIMS[k].adj} Sicht spricht ${a.side === "pro" ? "dafür" : "dagegen"}:` : (a.side === "pro" ? "Dafür spricht außerdem:" : "Dagegen spricht jedoch:");
    out.push(`${lead} ${t[0].toUpperCase() + t.slice(1)}${a.m && !t.includes(a.m) ? ` (${a.m})` : ""}.`);
  }));
  if (d.kt.trim()) out.push(sentence(d.kt));
  else if (d.ka && d.kb) out.push(`Zwischen ${DIMS[d.ka].name} und ${DIMS[d.kb].name} besteht ein Zielkonflikt: … Schwerer wiegt meines Erachtens …, weil …`);
  out.push(`Insgesamt komme ich zu dem Urteil, dass ${c.subj} ${POS[d.pos + 2]} ${c.adj} ist, weil …`);
  out.push("Dieses Urteil gilt allerdings nur, sofern …");
  return out.join(" ");
}
function s5(c, d){
  $("stepbox").innerHTML = `<h2>5 · Urteilen</h2>
  <div class="posline"><label class="lab" for="pos">Positionslinie: Wo stehst du?</label>
    <input type="range" id="pos" min="-2" max="2" step="1" value="${d.pos}">
    <div class="ends"><span>${esc(c.poles[0])}</span><span>${esc(c.poles[1])}</span></div>
    <div class="now" id="posnow">${esc(c.subj[0].toUpperCase() + c.subj.slice(1))} ist ${POS[d.pos + 2]} ${esc(c.adj)}.</div></div>
  <div><div class="spread" style="margin-bottom:6px"><label class="lab" for="txt" style="margin:0">Dein Urteil als Fließtext</label><span class="note" id="wc">${words(d.text)} Wörter</span></div>
    <div class="row" style="margin-bottom:8px"><button class="btn ghost small" id="skel">Gerüst aus Schreibplan erzeugen</button><span id="skelq"></span></div>
    <textarea id="txt" class="big" placeholder="Schreibe hier dein Urteil. Tipp: Erzeuge zuerst ein Gerüst aus deinem Schreibplan und überarbeite es dann.">${esc(d.text)}</textarea></div>
  <details><summary style="cursor:pointer;font-weight:700">Satzbausteine einfügen</summary>
    <div style="display:grid;gap:10px;margin-top:10px">${BAUSTEINE.filter(b => b[0] !== "Verbindungswörter").map(b => `<div><p class="mono muted" style="margin-bottom:4px">${b[0]}</p>${insChips(b[1], "txt")}</div>`).join("")}</div></details>
  <div><p class="lab" style="font-weight:700;margin-bottom:6px">Checkliste: Prüfe deinen Text</p>
    <div class="checks">${CHECK.map(k => `<label><input type="checkbox" data-c="${k[0]}" ${d.checks.includes(k[0]) ? "checked" : ""}><span>${k[1]}<small>${k[2]}</small></span></label>`).join("")}</div></div>
  <div class="row"><button class="btn" id="copy">Text kopieren</button><button class="btn ghost" id="mus">${d.muster ? "Musterlösung ausblenden" : "Musterlösung zeigen"}</button></div>
  ${d.muster ? `<div class="muster"><h3>Erwartungshorizont</h3><ul>${c.erw.map(e => `<li>${esc(e)}</li>`).join("")}</ul>
    <h3>Mögliche Lösung</h3><p>${esc(c.muster)}</p>
    <p class="note">Das ist eine von mehreren guten Lösungen. Ein anderes Urteil ist ebenso richtig, wenn es gut begründet und abgewogen ist.</p></div>` : ""}
  <div class="navrow"><button class="btn ghost" id="prev">← Zurück</button><span id="resetbox"><button class="linkbtn" id="reset" style="color:var(--bad)">Fall zurücksetzen</button></span></div>`;
  const pos = $("pos");
  pos.oninput = () => { d.pos = +pos.value; save(); $("posnow").textContent = `${c.subj[0].toUpperCase() + c.subj.slice(1)} ist ${POS[d.pos + 2]} ${c.adj}.`; };
  const txt = $("txt");
  txt.oninput = () => { d.text = txt.value; save(); $("wc").textContent = words(d.text) + " Wörter"; };
  $("skel").onclick = () => {
    const put = () => { txt.value = skeleton(c, d); txt.dispatchEvent(new Event("input")); $("skelq").innerHTML = ""; };
    if (!txt.value.trim()) return put();
    $("skelq").innerHTML = `<span class="note">Vorhandenen Text ersetzen?</span> <button class="btn warn small" id="sk-y">Ersetzen</button> <button class="btn ghost small" id="sk-n">Abbrechen</button>`;
    $("sk-y").onclick = put; $("sk-n").onclick = () => $("skelq").innerHTML = "";
  };
  document.querySelectorAll("[data-c]").forEach(b => b.onchange = () => { toggle(d.checks, b.dataset.c); save(); });
  $("copy").onclick = e => copyText(`${c.frage}\n\n${txt.value}`, e.target);
  $("mus").onclick = () => { d.muster = !d.muster; save(); s5(c, d); };
  $("prev").onclick = () => go(c, 4);
  $("reset").onclick = () => {
    $("resetbox").innerHTML = `<span class="note">Alles in diesem Fall löschen?</span> <button class="btn warn small" id="r-y">Löschen</button> <button class="btn ghost small" id="r-n">Abbrechen</button>`;
    $("r-y").onclick = () => { W.c[c.id] = blank(); save(); vFall(c); };
    $("r-n").onclick = () => s5(c, d);
  };
  bindIns();
}

/* ---------- Reparieren ---------- */
function vRep(){
  $("view").innerHTML = `<div class="narrow"><section class="hero"><h1>Urteile reparieren</h1>
    <p>Drei Schülerurteile mit typischen Schwächen. Finde heraus, was fehlt, und vergleiche dann mit einer verbesserten Fassung.</p></section>
    ${REPAIR.map(r => {
      const st = W.r[r.id] || { sel:[], done:false }, c = CASES.find(x => x.id === r.fall);
      return `<section class="panel" id="rp-${r.id}"><div class="spread"><h2 style="font-size:22px">${esc(r.titel)}</h2><a class="linkbtn" href="#fall-${c.id}">Material ansehen</a></div>
      <p class="muted" style="font-size:15px">Aufgabe: ${esc(c.frage)}</p>
      <p class="weak">${esc(r.text)}</p>
      <p style="font-weight:700">Welche Schwächen hat dieses Urteil? Markiere alle.</p>
      <div class="checks">${CHECK.map(k => {
        const on = st.sel.includes(k[0]), bad = r.flaws.includes(k[0]);
        let res = "";
        if (st.done) res = bad ? (on ? `<span class="res-ok">✓ erkannt</span>` : `<span class="res-no">übersehen</span>`) : (on ? `<span class="res-no">ist erfüllt</span>` : "");
        return `<label><input type="checkbox" data-r="${r.id}" data-c="${k[0]}" ${on ? "checked" : ""} ${st.done ? "disabled" : ""}><span>Fehlt: ${k[1]} ${res}<small>${k[2]}</small></span></label>`;
      }).join("")}</div>
      ${st.done ? `<p style="font-weight:700">Verbesserte Fassung</p><p class="good">${esc(r.besser)}</p>
        <div><button class="btn ghost small" data-again="${r.id}">Noch einmal</button></div>`
        : `<div><button class="btn" data-chk="${r.id}">Prüfen</button></div>`}</section>`;
    }).join("")}</div>`;
  document.querySelectorAll("[data-r]").forEach(b => b.onchange = () => { const st = W.r[b.dataset.r] || (W.r[b.dataset.r] = { sel:[], done:false }); toggle(st.sel, b.dataset.c); save(); });
  document.querySelectorAll("[data-chk]").forEach(b => b.onclick = () => { const st = W.r[b.dataset.chk] || (W.r[b.dataset.chk] = { sel:[], done:false }); st.done = true; save(); const y = window.scrollY; vRep(); window.scrollTo(0, y); });
  document.querySelectorAll("[data-again]").forEach(b => b.onclick = () => { W.r[b.dataset.again] = { sel:[], done:false }; save(); const y = window.scrollY; vRep(); window.scrollTo(0, y); });
}

    <tr><td><b>bewerten</b></td><td>wie beurteilen, zusätzlich eigene Wertmaßstäbe offenlegen und begründen</td><td>Werturteil: wünschenswert, vertretbar, abzulehnen</td></tr>
